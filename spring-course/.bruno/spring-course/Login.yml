info:
  name: Login
  type: http
  seq: 8

http:
  method: POST
  url: http://localhost:8080/api/auth/login
  body:
    type: json
    data: |-
      {
        "username": "giulio",
        "password": "password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.accessToken) {
          bru.setEnvVar("access_token", res.body.accessToken);
        } else {
          console.error("Get JWT", res.status, res.body);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
